<div class="price-card">

  <div
    class="tour-image"
    [ngClass]="tour.image">
  </div>

  <h3>{{ tour.name }}</h3>

  <p>{{ tour.days }} days adventure</p>

  <div class="tour-meta">
    ⭐ {{ tour.rating }}
  </div>

  <div class="price">
    €{{ tour.price }}
  </div>

  <div class="buttons">

    <button class="details-btn">
      Details
    </button>

    <button class="book-btn"
            (click)="bookTour()">
      Book
    </button>

  </div>

</div>
