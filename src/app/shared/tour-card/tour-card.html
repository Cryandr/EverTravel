<p>tour-card works!</p>

<div class="price-card">

  <div
    class="tour-image"
    [ngClass]="tour.image">
  </div>

  <h3>{{ tour.name }}</h3>

  <p>{{ tour.days }} days adventure</p>

  <div class="tour-meta">
    ⭐ {{ tour.rating }}
  </div>

  <div class="price">
    €{{ tour.price }}
  </div>

  <button (click)="bookTour()">
    Book Tour
  </button>

</div>
